                                type: string
                                enum:
                                - approximate
                              region:
                                type: string
                              country:
                                type: string
                              timezone:
                                type: string
                            required:
                            - city
                            - type
                            - region
                            - country
                            - timezone
                          filters:
                            type:
                            - object
                            - 'null'
                            properties:
                              allowed_domains:
                                type: array
                                items:
                                  type: string
                            required:
                            - allowed_domains
                          isManaged:
                            type: boolean
                          systemPrompt:
                            type:
                            - string
                            - 'null'
                        required:
                        - createdAt
                        - updatedAt
                        - projectId
                        - name
                        - modelType
                        - searchContextSize
                        - userLocation
                        - filters
                        - isManaged
                        - systemPrompt
                    required:
                    - id
                    - type
                    - links
                    - attributes
                required:
                - data
              example:
                data:
                  id: 00000000-0000-0000-0000-000000000001
                  type: webSearchTools
                  links:
                    self: http://www.example.com/api/web_search_tools/00000000-0000-0000-0000-000000000001
                  attributes:
                    createdAt: '2025-05-01T05:05:14.000Z'
                    updatedAt: '2025-05-01T05:05:14.000Z'
                    projectId: 00000000-0000-0000-0000-000000000001
                    name: TestSearch
                    modelType: gpt-5
                    searchContextSize: medium
                    userLocation:
                      city: Minato
                      type: approximate
                      region: Tokyo
                      country: JP
                      timezone: Asia/Tokyo
                    filters:
                      allowed_domains:
                      - medical.example.test
                      - research.example.test
                      - health.example.test
                    isManaged: false
                    systemPrompt: You are a helpful search assistant.
    patch:
      summary: update
      tags:
      - WebSearchTool
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 00000000-0000-0000-0000-000000000001
      responses:
        '200':
          description: updates the web_search_tool
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      links:
