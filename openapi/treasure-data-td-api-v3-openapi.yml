        expire_days:
          nullable: true
          type: integer
          example: 30
        include_v:
          description: >-
            when true, Hive queries can access a virtual column "v" which
            contains a map of every data column's name to its value (represented
            as a string). Prefer to set a schema on the table instead of using
            "v".
          type: boolean
          example: false
          deprecated: true
        last_log_timestamp:
          type: integer
          nullable: true
          example: 1356998400
        name:
          type: string
          example: Bravo
        description:
          description: user-provided description of the table
          type: string
          example: Click events.
          nullable: true
        schema:
          type: string
          description: >-
            JSON-encoded table schema. When include_descriptions=true, contains
            column descriptions in format [[name, type, alias, description],
            ...]
        type:
          type: string
          enum:
            - log
          example: log
        updated_at:
          $ref: '#/components/schemas/DateTimeAsString'
    TableSchemaAsString:
      description: A JSON serialization of the Table Schema
      type: string
      example: '[["name", "string", "first_name"], ["creation_date", "long"]]'
    TableSchemaAsArray:
      type: array
      items:
        $ref: '#/components/schemas/ColumnSchemaAsArray'
      example:
        - - name
          - string
          - first_name
        - - creation_date
          - long
    ColumnSchemaAsArray:
      description: >-
        An array with (in order) `[name, type, alias, description]` of a column.
        `Alias` and `description` are optional.
      type: array
      minItems: 2
      maxItems: 4
      items:
        type: string
      example:
        - name
        - string
        - first_name
        - User's name column
    ColumnSchema:
      type: object
      additionalProperties: false
      required:
        - key
        - type
        - name
      properties:
        key:
          type: string
          example: age
        type:
          type: string
          example: integer
        name:
          type: string
          example: age
    ImportResponse:
      type: object
      required:
        - elapsed_time
        - database
        - md5_hex
        - table
        - unique_id
      properties:
        elapsed_time:
          type: integer
          example: 0
        database:
          $ref: '#/components/schemas/Database/properties/name'
        md5_hex:
          $ref: '#/components/schemas/HexValue'
        table:
          $ref: '#/components/schemas/Table/properties/name'
        unique_id:
          $ref: '#/components/schemas/HexValue'
    UserPassword:
      title: User Password
      description: the user's password
      type: string
      format: password
      example: pa$$w0rd
    UserId:
      type: integer
      example: 123
    SSOIdentifier:
      description: SSO identifier from IdP
      type: string
      minLength: 1
      example: employee_number-00001
    SSOFullQualifiedIdentifier:
      description: SSO full qualified identifier from IdP
      type: string
      minLength: 1
      example: employee_number-00001
    SSOSettingName:
      description: SSO setting name corresponding to IdP
      type: string
      minLength: 1
      example: corp-idp-1
    User:
      title: User
      description: User
      type: object
      additionalProperties: false
      required:
        - id
        - account_owner
        - administrator
        - created_at
        - email
        - first_name
        - gravatar_url
        - last_name
        - phone
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        account_owner:
          description: whether the user is Account owner or not
          type: boolean
          example: true
        administrator:
          description: whether the user is Administrator or not
          type: boolean
          example: true
        created_at:
          $ref: '#/components/schemas/DateTimeISO8601'
        email:
          description: the email user uses to log in
          type: string
          format: email
          example: td@example.com
        first_name:
          description: first name
          type: string
          nullable: true
          example: Treasure
        gravatar_url:
          description: gravatar url
          type: string
          example: http://foo
        identifier:
          $ref: '#/components/schemas/SSOIdentifier'
        full_qualified_identifier:
          $ref: '#/components/schemas/SSOFullQualifiedIdentifier'
        setting_name:
          $ref: '#/components/schemas/SSOSettingName'
        last_name:
          description: last name
          type: string
          nullable: true
          example: Data
        name:
          description: user's full name or email
          type: string
          example: Treasure Data
        organization:
          deprecated: true
          type: string
          nullable: true
        phone:
          description: phone number
          type: string
          nullable: true
          example: (650) 469-3644
        roles:
          deprecated: true
          type: array
          items:
            type: string
        updated_at:
          $ref: '#/components/schemas/DateTimeISO8601'
        delegated_admin:
          description: >-
            whether the user is a Delegated Admin or not. This attribute is
            available if the account enables the delegated-admin feature flag.
          type: boolean
          example: true
        delegated_policy_groups:
          description: >-
            The list of policy groups this user manages as delegated admin. This
            attribute is available if the account enables the delegated-admin
            feature flag.
          type: array
          items:
            type: string
        policy_group_tags:
          description: >-
            The list of tag names belonging to this user. This attribute is
            available if the account enables the delegated-admin feature flag.
          type: array
          items:
            type: string
  parameters:
    PageAfter:
      name: page[after]
      in: query
      description: >
        Cursor for the current page. If omitted, the first page is returned.

        It must be a Base64-encoded JSON string, including an object with a
        single entry.

        For example, the cursor `eyJpZCI6IjEyMyJ9` is decoded to `{"id":"123"}`.
      required: false
      schema:
        type: string
        format: base64
        example: eyJpZCI6IjEyMyJ9
    PageSize:
      name: page[size]
      in: query
      description: Max number of results.
      required: false
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
        example: 30
    ResourceTypeFilter:
      name: resource_type
      in: query
      description: >
        Filter results by resource type. Accepts a comma-separated string (e.g.
        `WorkflowProject,Segmentation`)

        or an array query param (e.g.
        `resource_type[]=WorkflowProject&resource_type[]=Segmentation`).

        Unrecognized resource types match zero results. If omitted, results are
        not filtered by resource type.
      required: false
      explode: false
      style: form
      schema:
        oneOf:
          - type: string
            example: WorkflowProject,Segmentation
          - type: array
            items:
              type: string
            example:
              - WorkflowProject
              - Segmentation
    SortedBy:
      name: sorted_by
      in: query
      description: >
        Sort order for the results. If omitted, the default sort order is
        applied.

        Format: `<key>:asc` or `<key>:desc`
      required: false
      schema:
        type: string
        example: created_at:desc
    header_authorization_TD1:
      name: Authorization
      description: TD1 Authorization Header
      in: header
      required: false
      schema:
        type: string
        pattern: ^TD1 [0-9a-f/]+$
        example: TD1 123/456789xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    path_access_control_policy_id:
      name: policy_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccessControlPolicyId'
    path_access_control_policy_group_id_or_taggable_name:
      name: policy_group_id_or_taggable_name
      in: path
      required: true
      schema:
        anyOf:
          - $ref: '#/components/schemas/AccessControlPolicyGroupId'
          - $ref: '#/components/schemas/AccessControlPolicyGroupTaggableName'
        example: 67 or some_policy_group
    path_account_id:
      name: account_id
      description: the account id
      in: path
      schema:
        $ref: '#/components/schemas/AccountId'
      required: true
    path_bulk_import_name:
      name: bulk_import_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BulkImport/properties/name'
    path_bulk_import_part_name:
      name: bulk_import_part_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BulkImportPartName'
    path_bulk_load_session_name:
      name: bulk_load_session_name
      in: path
      schema:
        $ref: '#/components/schemas/BulkLoadSession/properties/name'
      required: true
    path_bulk_load_session_id:
      name: bulk_load_session_id
      in: path
      schema:
        $ref: '#/components/schemas/BulkLoadSessionId'
      required: true
    bulk_load_session_ids:
      name: ids
      in: query
      schema:
        oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/BulkLoadSessionId'
          - type: string
            description: Comma-separated list of bulk load session IDs E.g. 1,2,3
    bulk_load_session_names:
      name: names
      in: query
      schema:
        oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/BulkLoadSession/properties/name'
          - type: string
            description: >-
              Comma-separated list of bulk load session names E.g.
              bulkload1,bulkload2,bulkload3
    path_connection_id:
      name: connection_id
      description: the connection id
      required: true
      in: path
      schema:
        type: integer
    path_connection_name:
      name: connection_name
      description: the connection name
      required: true
      in: path
      schema:
        $ref: '#/components/schemas/Connection/properties/name'
    path_database_name:
      name: database_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Database/properties/name'
    require_permissions:
      name: require_permissions
      in: query
      required: false
      schema:
        type: string
        pattern: 'true'
    path_job_id:
      name: job_id
      description: the job id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobId'
    path_job_type:
      name: job_type
      description: the job type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Job/properties/type'
    path_tag:
      name: tag
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Tag'
    path_schedule_id:
      name: schedule_id
      in: path
      required: true
      schema:
        type: integer
        example: 31
    path_schedule_name:
      name: schedule_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Schedule/properties/name'
    path_table_id:
      name: table_id
      description: the table id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TableId'
    path_table_name:
      name: table_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Table/properties/name'
    path_user_id:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
    path_user_email:
      name: user_email
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/User/properties/email'
    path_user_first_name:
      name: user_first_name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/User/properties/first_name'
  responses:
