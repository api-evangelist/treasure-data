  /table/deleted:
    get:
      summary: List deleted tables
      description: >-
        Returns a paginated list of deleted recoverable tables for the
        authenticated account.
      operationId: listDeletedTables
      tags:
        - Tables
      parameters:
        - name: cursor_id
          in: query
          description: ID of the last table from the previous page; omit for the first page
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          description: Number of tables to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: database_id
          in: query
          description: Filter deleted tables by database ID
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedTablesWithCursor'
  /table/recover/{table_id}:
    post:
      summary: Recover deleted table
      description: >-
        Recovers a deleted table. If the parent database is also deleted, with
        proper permissions it will be recovered automatically.
      operationId: recoverTableById
      tags:
        - Tables
      parameters:
        - name: table_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TableId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                table_name:
                  description: >-
                    Alternative name for the recovered table to avoid conflicts
                    with existing tables
                  $ref: '#/components/schemas/Table/properties/name'
                database_name:
                  description: >-
                    Alternative name for the recovered parent database to avoid
                    conflicts with existing databases
                  $ref: '#/components/schemas/Database/properties/name'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveredTable'
        4XX:
          $ref: '#/components/responses/4XX'
        5XX:
          $ref: '#/components/responses/5XX'
