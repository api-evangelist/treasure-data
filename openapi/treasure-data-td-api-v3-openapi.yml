            schema:
              type: object
              additionalProperties: false
              required:
                - dest_database_name
              properties:
                dest_database_name:
                  $ref: '#/components/schemas/Database/properties/name'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableReference'
  /table/transfer/{database_name}/{table_name}:
