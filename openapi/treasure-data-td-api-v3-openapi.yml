    Job:
      title: Job
      description: an execution of a query
      type: object
      required:
        - cpu_time
        - created_at
        - database
        - duration
        - end_at
        - hive_result_schema
        - job_id
        - linked_result_export_job_id
        - num_records
        - organization
        - priority
        - query
        - result_export_target_job_id
        - result_size
        - retry_limit
        - start_at
        - status
        - type
        - updated_at
        - url
        - user_name
      properties:
        cpu_time:
          nullable: true
          type: integer
        created_at:
          $ref: '#/components/schemas/DateTimeAsString'
        database:
          description: database name
          nullable: true
          type: string
        duration:
          description: Duration
          type: integer
          nullable: true
          example: 10
        end_at:
          oneOf:
            - $ref: '#/components/schemas/DateTimeAsString'
            - $ref: '#/components/schemas/EmptyString'
        hive_result_schema:
          description: the schema for the job's result table
          type: string
          nullable: true
        job_id:
          $ref: '#/components/schemas/JobIdAsString'
        linked_result_export_job_id:
          anyOf:
            - $ref: '#/components/schemas/JobId'
            - description: result job id
              nullable: true
              type: integer
        num_records:
          description: >-
            the number of records in the result. Will be `null` until job has
            finished, and may not be set for all query types
          type: integer
          nullable: true
          example: 100
        organization:
          description: always "null"
          type: string
          nullable: true
          deprecated: true
        priority:
          description: job execution priority
          type: integer
          minimum: -2
          maximum: 2
          example: 0
        query:
          anyOf:
            - nullable: true
              type: string
            - $ref: '#/components/schemas/QueryAsString'
            - $ref: '#/components/schemas/BulkLoadConfig'
        result:
          description: URL of the result output destination
          type: string
        result_export_target_job_id:
          anyOf:
            - $ref: '#/components/schemas/JobId'
            - description: result export job id
              nullable: true
              type: integer
        result_size:
          description: size in bytes of the job's result, in `msgpack.gz` format
          type: integer
          nullable: true
          example: 1048576
        retry_limit:
          description: automatically retry this many times on failure
          type: integer
          default: 0
          minimum: 0
          maximum: 32
          example: 3
        start_at:
          oneOf:
            - $ref: '#/components/schemas/DateTimeAsString'
            - $ref: '#/components/schemas/EmptyString'
        status:
          description: current status of the job
          type: string
          enum:
            - queued
            - running
            - killed
            - success
            - error
          example: success
        type:
          type: string
          example: presto
        updated_at:
          $ref: '#/components/schemas/DateTimeAsString'
        url:
          type: string
        user_name:
          $ref: '#/components/schemas/User/properties/name'
