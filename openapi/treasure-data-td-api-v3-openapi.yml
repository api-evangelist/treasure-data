        - $ref: '#/components/parameters/path_table_name'
        - name: table_type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Table/properties/type'
        - name: idempotent_key
          in: query
          description: A unique key to ensure idempotency of requests
          schema:
            $ref: '#/components/schemas/IdempotentKey'
        - name: source_table
          in: query
          description: Name of an existing table to copy metadata from
          schema:
            type: string
        - name: including_properties
          in: query
          description: >-
            When true, distribution and other properties will be copied from
            source_table
          schema:
            type: boolean
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                expire_days:
                  $ref: '#/components/schemas/Table/properties/expire_days'
                include_v:
                  $ref: '#/components/schemas/Table/properties/include_v'
                description:
                  $ref: '#/components/schemas/Table/properties/description'
                schema:
                  oneOf:
                    - $ref: '#/components/schemas/TableSchemaAsArray'
                    - $ref: '#/components/schemas/TableSchemaAsString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableReference'
  /table/create/{database_name}/{table_name}:
    post:
      summary: Create table
      description: >-
        Creates a table with default type 'log'. This endpoint offers the same
        functionality as the typed endpoint but without explicitly specifying
        the table type. Schema can include column descriptions in the format
        `[name, type, alias, description]`.
      operationId: createTable
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - $ref: '#/components/parameters/path_table_name'
        - name: idempotent_key
          in: query
          description: A unique key to ensure idempotency of requests
          schema:
            $ref: '#/components/schemas/IdempotentKey'
        - name: source_table
          in: query
          description: Name of an existing table to copy metadata from
          schema:
            type: string
        - name: including_properties
          in: query
          description: >-
            When true, distribution and other properties will be copied from
            source_table
          schema:
            type: boolean
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                expire_days:
                  $ref: '#/components/schemas/Table/properties/expire_days'
                include_v:
                  $ref: '#/components/schemas/Table/properties/include_v'
                description:
                  $ref: '#/components/schemas/Table/properties/description'
                schema:
                  oneOf:
                    - $ref: '#/components/schemas/TableSchemaAsArray'
                    - $ref: '#/components/schemas/TableSchemaAsString'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableReference'
  /table/update/{database_name}/{table_name}:
    post:
      summary: Update table
      description: Updates a table.
      operationId: updateTable
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - $ref: '#/components/parameters/path_table_name'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                detect_schema:
                  type: boolean
                  example: true
                expire_days:
                  $ref: '#/components/schemas/Table/properties/expire_days'
                include_v:
                  $ref: '#/components/schemas/Table/properties/include_v'
                name:
                  $ref: '#/components/schemas/Table/properties/name'
                description:
                  $ref: '#/components/schemas/Table/properties/description'
                schema:
                  oneOf:
                    - $ref: '#/components/schemas/TableSchemaAsArray'
                    - $ref: '#/components/schemas/TableSchemaAsString'
                ignore_duplicate_schema:
                  type: boolean
                  example: true
                overwrite:
                  description: >-
                    whether to override a possible existing table in case of
                    updating the name
                  type: boolean
                  example: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableReference'
  /table/rename/{database_name}/{current_table_name}/{new_table_name}:
    post:
      summary: Rename table
      description: Renames a specified table.
      operationId: renameTable
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - name: current_table_name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Table/properties/name'
        - name: new_table_name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Table/properties/name'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableReference'
  /table/swap/{database_name}/{table_name_1}/{table_name_2}:
    post:
      summary: Swap tables
      description: Swaps specified tables.
      operationId: swapTables
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - name: table_name_1
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Table/properties/name'
        - name: table_name_2
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Table/properties/name'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - database
                  - table1
                  - table2
                properties:
                  database:
                    $ref: '#/components/schemas/Database/properties/name'
                  table1:
                    $ref: '#/components/schemas/Table/properties/name'
                  table2:
                    $ref: '#/components/schemas/Table/properties/name'
  /table/tail/{database_name}/{table_name}{path_format}:
    get:
      summary: Tail table
      description: Shows the last record in a table.
      operationId: tailTable
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - $ref: '#/components/parameters/path_table_name'
        - name: path_format
          in: path
          style: label
          required: true
          schema:
            type: string
            enum:
              - json
              - msgpack
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - msgpack
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyValue'
            application/octet-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyValue'
  /table/distribution/{database_name}/{table_name}:
    get:
      summary: Get table distribution
      description: Retrieve a table distribution.
      operationId: getTableDistribution
      tags:
        - Tables
      parameters:
        - $ref: '#/components/parameters/path_database_name'
        - $ref: '#/components/parameters/path_table_name'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - bucket_count
                  - partition_function
                  - columns
                properties:
                  bucket_count:
                    type: integer
                    example: 50
                  partition_function:
                    type: string
                    example: hash
                  columns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ColumnSchema'
  /table/change_database/{database_name}/{table_name}:
    post:
      summary: Change database
