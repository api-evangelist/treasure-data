              - COMPOSITE_CONDITION_TOO_FEW_RULES_REFERENCED
              - COMPOSITE_CONDITION_TOO_FEW_RULE_SETS_REFERENCED
              - COMPOSITE_CONDITION_MISSING_RULE_IDENTIFIER
              - COMPOSITE_CONDITION_SYNTAX_ERROR
              - COMPOSITE_CONDITION_TOO_LONG_ALPHABETICAL_IDENTIFIER
              - COMPOSITE_CONDITION_TOO_LONG_NUMERICAL_IDENTIFIER
              - PREDICTIVE_SEGMENT_NOT_YET_SCORED
              - PREDICTIVE_SEGMENT_NOT_YET_TRAINED
              - IS_IMMUTABLE
              - UNKNOWN
              - TOO_MANY_BEHAVIOR_RULES
              - INVALID_WINDOW_DURATION
              - UNDEFINED_ENTRY_CRITERIA
              - UNDEFINED_MILESTONE
              - UNDEFINED_ACTIVATION_STEP
              - UNDEFINED_WAIT_STEP
              - UNDEFINED_EXIT_CRITERIA
              - UNDEFINED_DECISION_CONDITION
              - UNDEFINED_MERGE_POINT
              - UNUSED_IN_ID_LINK
              - TOO_MANY_PRIMARY_KNOWN_IDS
              - TOO_LESS_PRIMARY_KNOWN_IDS
              - TOO_MANY_RT_SEGMENTS
          required:
          - validationCode
      required:
      - code
      - status
      - detail
      - source
      - meta
    JourneyProfilesJsonApiResource:
      type: object
      required:
      - names
      - rows
      properties:
        names:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            description: a tuple whose values corresponding names property
            example:
            - 003171af29a5f0ac890fed022d9e5366dea5d68e
            - a@example.com
            items:
              oneOf:
              - type:
                - string
                - 'null'
              - type: integer
                format: int64
              - type: number
                format: float
    partial_journey.yaml-JourneyOnDemandExecutionErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              detail:
                type: string
              meta:
                type: object
                properties:
                  validationCode:
                    type: string
    partial_journey.yaml-EntitiesJourneyBundleNewJourneyNotAppendableJsonApiResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiValidationError'
    partial_journey.yaml-EntitiesJourneyBundleJsonApiResponse:
      type: object
      properties:
        name:
          type: string
          description: Name of the journey bundle
        description:
          type: string
          description: Description of the journey bundle
        latestJourneyId:
          description: Derived from the initial journey version name
        lastVersionNumber:
          type: integer
          description: 'The version number of the most recently created journey. If no journey has been created, this will be 0.

            '
        journeys:
          type: array
          items:
            $ref: '#/components/schemas/JourneyJsonApiResource'
        latestExecution:
          description: 'The most recent execution of the latest journey. If no executions have been created, this will be null. '
          allOf:
          - $ref: '#/components/schemas/Execution'
        parentSegmentLatestExecution:
          description: 'The most recent execution of the latest journey. If no executions have been created, this will be null. '
          allOf:
          - $ref: '#/components/schemas/Execution'
          - type: object
            properties:
              audienceId:
                type: string
                format: integer
        included:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/UserJsonApiResource'
            - $ref: '#/components/schemas/JourneyJsonApiResource'
    ActivationTemplateFieldProperties:
      description: activation template field properties
      type: object
      properties:
        locked:
          $ref: '#/components/schemas/ActivationTemplateFieldPropertiesLocked'
      required:
      - locked
    RepeatSubFrequency:
      type: array
      description: 'Parameter for more detailed frequency settings. Values are array of integers.

        Currently, this parameter is only valid for repeat unit "week".

        For multiple days of the week, each value should be 1 to 7.

        1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday, 7: Sunday

        '
      example:
      - 1
      - 5
      - 6
      default: []
      items:
        type: integer
        format: int64
    partial_journey.yaml-JourneyExecutionJsonApiResource:
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          pattern: '[1-9][0-9]*'
          description: workflowAttemptId is used as id
        type:
          type: string
          enum:
          - execution-journey
        attributes:
          allOf:
          - $ref: '#/components/schemas/ExecutionCore'
          - type: object
            properties:
              journeyId:
                type: string
                pattern: '[1-9][0-9]*'
    JourneySankeyChart:
      type: object
      properties:
        attributes:
          type: object
          properties:
            updatedAt:
              type: string
              format: datetime
            journeyStageId:
              type:
              - string
              - 'null'
              pattern: '[1-9][0-9]*'
            chart:
              type: object
              properties:
                title:
                  type: string
                chartType:
                  type: string
                  enum:
                  - sankey
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/JourneySankeyChartNode'
                metaData:
                  type: object
                  properties:
                    links:
                      type: array
                      items:
                        $ref: '#/components/schemas/JourneySankeyChartLink'
    JourneyAbTestVariant:
      type: object
      required:
      - id
      - name
      - percentage
      properties:
        id:
          type: string
        name:
          type: string
        percentage:
          type: number
        next:
          type: string
        isControlGroup:
          type: boolean
          description: Marks a variant as the control group (required when enabledCapping is true)
        cappingAt:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Capping threshold per variant (required for non-control variants when capping is enabled)
    AudienceBehaviorSchemaWithVisibility:
      required:
      - name
      - type
      - parentColumn
      type: object
      properties:
        name:
          type: string
          description: Column name user defined on Master Segment Configuration page of Data Workbench
        type:
          $ref: '#/components/schemas/ColumnType'
        parentColumn:
          type:
          - string
          - 'null'
          description: Column name of the behavior table (This can be null when the column is an enriched column)
        matrixColumnName:
          type: string
          description: Column name of the behavior table
        matrixColumnDescription:
          type:
          - string
          - 'null'
          description: Description of the column in behavior table
        visibility:
          type: string
          enum:
          - clear
          - pii
          - non_pii
          - blocked
    JourneyDuplicateJsonApiResource:
      type: object
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          pattern: '[1-9][0-9]*'
          description: source journey id
        type:
          type: string
          enum:
          - journey
        attributes:
          type: object
          required:
          - name
          properties:
            name:
              type: string
        relationships:
          type: object
          properties:
            parentFolder:
              $ref: '#/components/schemas/RelationshipsFolderJsonApiResource'
    FunctionExpression:
      oneOf:
      - type: object
        properties:
          function:
            type: string
            enum:
            - +
            - '-'
            - '*'
            - /
          arg:
            type: number
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - replace
          search:
            type: string
          replacement:
            type:
            - string
            - 'null'
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - substr
          start:
            type: number
          length:
            type: number
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - regexp_extract
          pattern:
            type: string
          group:
            type: number
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - day_of_week
            - from_iso8601_timestamp
            - ln
            - elapsed_days
            - td_ip_to_least_specific_subdivision_name
            - td_ip_to_country_name
            - td_ip_to_city_name
            - td_ip_to_connection_type
            - td_ip_to_domain
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - cast_as_quantitative
          default:
            type: number
            format: float
        required:
        - function
        - default
      - type: object
        properties:
          function:
            type: string
            enum:
            - cast_as_categorical
          default:
            type: string
        required:
        - function
        - default
      - type: object
        properties:
          function:
            type: string
            enum:
            - cast_as_categorical_array
        required:
        - function
      - type: object
        properties:
          function:
            type: string
            enum:
            - if
          op:
            type: string
            enum:
            - '>'
            - <
            - <=
            - '>='
            - '='
            - '!='
            - is
            - is\
            - not
          right_value:
            type:
            - number
            - 'null'
          then:
            type: number
          else:
            type: number
        required:
        - function
    JourneyDetailJsonApiResource:
      type: object
      required:
      - attributes
      - relationships
      properties:
        attributes:
          type: object
          properties:
            name:
              type: string
            description:
              type:
              - string
              - 'null'
            journeyStages:
              type: array
              minLength: 1
              maxLength: 8
              items:
                $ref: '#/components/schemas/JourneyStageDetailJsonApiResource'
            journeyBundleName:
              type:
              - string
              - 'null'
              description: Name of the journey bundle if it is assumed to be changed.
        relationships:
          type: object
          properties:
            parentFolder:
              $ref: '#/components/schemas/RelationshipsFolderJsonApiResource'
            createdBy:
              $ref: '#/components/schemas/RelationshipsUserJsonApiResource'
            updatedBy:
              $ref: '#/components/schemas/RelationshipsUserJsonApiResource'
  responses:
    NonJsonApiForbiddenRequest:
      description: non-JSON:API formatted error for insufficient permission to access a resource
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
            required:
            - errors
  securitySchemes:
    TdApikeyAuth:
      type: apiKey
      in: header
      name: Authorization
