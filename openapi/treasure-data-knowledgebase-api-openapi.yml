                                status:
                                  type: string
                                message: {}
                                finishedAt: {}
                                logs: {}
                              required:
                              - status
                              - message
                              - finishedAt
                              - logs
                          required:
                          - createdAt
                          - updatedAt
                          - projectId
                          - name
                          - tdDatabaseName
                          - formatType
                          - maxRows
                          - timeoutSeconds
                          - isManaged
                          - tables
                          - lastJob
                        relationships:
                          type: object
                          properties:
                            createdBy:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                              required:
                              - data
                            updatedBy:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                    id:
                                      type: string
