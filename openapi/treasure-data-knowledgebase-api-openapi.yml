                            referencedByVariables:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                required:
                                - id
                          required:
                          - validationCode
                      required:
                      - title
                      - detail
                      - code
                      - source
                      - status
                      - meta
                required:
                - errors
              example:
                errors:
                - title: Cannot delete record because dependent referenced by variables exist
