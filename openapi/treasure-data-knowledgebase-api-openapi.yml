paths:
  /api/knowledge_bases:
    get:
      summary: index
      tags:
      - KnowledgeBase
      responses:
        '200':
          description: allows GET /api/knowledge_bases
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                          required:
                          - self
                        attributes:
                          type: object
                          properties:
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                            projectId:
                              type: string
                            name:
                              type: string
                            tdDatabaseName:
                              type: string
                            formatType:
                              type: string
                            maxRows:
                              type: integer
                            timeoutSeconds:
                              type: integer
                            isManaged:
                              type: boolean
                            tables:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  tdQuery:
                                    type: string
                                  enableData:
                                    type: boolean
