                - status
                - error
              example:
                status: '401'
                error: User credentials aren't set on the request
      parameters:
      - name: filter[fulltext]
        in: query
        required: false
        schema:
          type: string
        example: nothing
      - name: filter[hasInterfaces]
        in: query
        required: false
        schema:
          type: string
        example: form,chat
      - name: filter[has_form_interfaces]
        in: query
        required: false
        schema:
          type: string
        example: 'false'
      - name: filter[is_managed]
        in: query
        required: false
        schema:
          type: string
        example: 'false'
      - name: filter[manage_type]
        in: query
        required: false
        schema:
          type: string
        example: PARENT_SEGMENT,PACKAGE
      - name: include
        in: query
        required: false
        schema:
          type: string
        example: formInterfaces,chatInterfaces
      - name: sort
        in: query
        required: false
        schema:
          type: string
