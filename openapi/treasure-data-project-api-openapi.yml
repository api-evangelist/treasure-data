components:
  schemas:
    RestSecretMetadata:
      type: object
      description: Response of a secret
      properties:
        key:
          type: string
          description: key name
          example: td.apikey
      required:
      - key
    RestWorkflowDefinitionCollection:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/RestWorkflowDefinition'
    RestProject:
      type: object
      description: Response of a project
      properties:
        archiveMd5:
          type: string
          format: byte
          description: MD5 of archive
          example: ZGRJdysyQ3VjZXI2UUN1c1ZhRXdDUT09
        archiveType:
          type: string
          description: archive type
          example: s3
        createdAt:
          type: string
          format: date-time
          description: created time
          example: '2023-08-18T06:52:33Z'
        deletedAt:
          type: string
          format: date-time
          description: deleted time
          example: '2023-08-18T06:52:33Z'
        id:
          type: string
          description: project ID
          example: '123456'
        metadata:
          type: array
          description: project metadata
          items:
            $ref: '#/components/schemas/RestProjectMetadata'
        name:
          type: string
          description: project name
          example: project-a
        revision:
          type: string
          description: revision
          example: rev-20230101-1
        updatedAt:
          type: string
          format: date-time
          description: updated time
          example: '2023-08-18T06:52:33Z'
      required:
      - archiveType
      - createdAt
      - id
      - name
      - revision
      - updatedAt
    RestSessionCollection:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/RestSession'
    RestPagination:
      type: object
      description: Pagination information
      properties:
        nextPage:
          type: string
          description: next page URL
          example: /api/console/projects?last_id=123&count=300
    NameOptionalId:
      type: object
      description: Name and optional ID
      properties:
        id:
          type: string
          description: ID
          example: '123456'
        name:
          type: string
          description: name
          example: abcdefg
      required:
      - name
    RestSchedule:
      type: object
      description: Response of a schedule
      properties:
        disabledAt:
          type: string
          format: date-time
          description: disabled time
          example: '2023-08-18T06:52:33Z'
        id:
          type: string
          description: schedule ID
          example: '123456'
        nextRunTime:
          type: string
          format: date-time
          description: next run time
          example: '2023-08-18T06:52:33Z'
        nextScheduleTime:
          type: string
          description: next schedule time
          example: '2022-12-31T23:59:00+00:00'
        project:
          $ref: '#/components/schemas/IdAndName'
        workflow:
          $ref: '#/components/schemas/IdAndName'
      required:
      - id
      - nextRunTime
      - nextScheduleTime
      - project
      - workflow
    IdAndName:
      type: object
      description: Name and ID
      properties:
        id:
          type: string
          description: ID
          example: '123456'
        name:
          type: string
          description: name
          example: abcdefg
      required:
      - id
      - name
    RestSetSecretRequest:
      type: object
      description: Request body to set a secret
      properties:
        value:
          type: string
          description: value of the secret
          example: TD1 12345...
      required:
      - value
    RestSession:
      type: object
      description: Response of a session
      properties:
        id:
          type: string
          description: session ID
          example: '123456'
        lastAttempt:
          $ref: '#/components/schemas/Attempt'
        project:
          $ref: '#/components/schemas/IdAndName'
        sessionTime:
          type: string
          description: session time
          example: '2022-12-31T23:59:00+00:00'
        sessionUuid:
          type: string
          format: uuid
        workflow:
          $ref: '#/components/schemas/NameOptionalId'
      required:
      - id
      - project
      - sessionTime
      - workflow
    RestScheduleCollection:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/RestSchedule'
    Attempt:
      type: object
      description: Attempts of session
      properties:
        cancelRequested:
          type: boolean
          description: true if kill requested
        createdAt:
          type: string
          format: date-time
          description: created time
          example: '2023-08-18T06:52:33Z'
        done:
          type: boolean
          description: true if the attempt finished
        finishedAt:
          type: string
          format: date-time
          description: finished time
          example: '2023-08-18T06:52:33Z'
        id:
          type: string
          description: attempt ID
          example: '123456'
        params:
          type: object
          description: passed parameters as JSON
        poolId:
          type: string
          description: ID of the pool to which this attempt is assigned.
          example: '42'
        retryAttemptName:
          type: string
        status:
          type: string
          description: The current status of the attempt.
          enum:
          - blocked
          - queued
          - running
          - canceling
          - success
          - error
          - killed
          example: running
        success:
          type: boolean
          description: true if the attempt finished successfully
      required:
      - cancelRequested
      - createdAt
      - done
      - id
      - params
      - status
      - success
    RestRevision:
      type: object
      description: Response of a revision
      properties:
        archiveMd5:
          type: string
          format: byte
          description: MD5 of archive
          example: ZGRJdysyQ3VjZXI2UUN1c1ZhRXdDUT09
        archiveType:
          type: string
          description: archive type
          example: s3
        createdAt:
          type: string
          format: date-time
          description: created time
          example: '2023-08-18T06:52:33Z'
        revision:
          type: string
          description: revision
          example: rev-20230101-1
        userInfo:
          type: object
          description: User information as json
          example: '"td": {"user": {"id": 94,"name": "Your name","email": "example@treasure-data.com"}'
      required:
      - archiveType
      - revision
    RestSecretList:
      type: object
      description: Response of a secret
      properties:
        secrets:
          type: array
          description: 'array of RestSecretMetadata "{ key: key1 }"'
          example: '[{key: key1}, {key: key2}]'
          items:
            $ref: '#/components/schemas/RestSecretMetadata'
      required:
      - secrets
    RestProjectCollection:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RestProject'
    RestProjectMetadata:
      type: object
      description: project metadata
      properties:
        key:
          type: string
        value:
          type: string
    RestWorkflowDefinition:
      type: object
      description: Response of a workflow definition
      properties:
        config:
          type: object
        id:
          type: string
          description: workflow definition ID
          example: '123456'
        name:
          type: string
          description: workflow name
