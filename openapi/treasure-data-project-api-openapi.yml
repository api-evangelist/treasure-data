                            createdBy:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                              required:
                              - data
                            updatedBy:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                              required:
                              - data
                            formInterfaces:
                              type: object
                              properties:
                                data:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                      id:
                                        type: string
                                    required:
                                    - type
                                    - id
                              required:
                              - data
                            chatInterfaces:
                              type: object
                              properties:
                                data:
                                  type: array
                                  items: {}
                              required:
                              - data
                      required:
                      - id
                      - type
                      - links
                      - attributes
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                    required:
                    - total
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                    required:
                    - first
                    - last
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            firstAgentName:
                              type: string
                            firstIntegrationServiceType:
                              type: string
                            firstKnowledgeBaseName:
                              type: string
                            totalAgentCount:
                              type: integer
                            totalIntegrationCount:
                              type: integer
                            totalKnowledgeBaseCount:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                            projectId:
                              type: string
                            agentId:
                              type:
                              - string
                              - 'null'
                            promptTemplate:
                              type:
                              - string
                              - 'null'
                            formJsonSchema:
                              type:
                              - string
                              - 'null'
                            formUiSchema: {}
                            useTextResource:
                              type:
                              - boolean
                              - 'null'
                            starterMessage:
                              type:
                              - string
                              - 'null'
                            textInputEnabled:
                              type:
                              - boolean
                              - 'null'
                            textInputAgentId: {}
                            isManaged:
                              type:
                              - boolean
                              - 'null'
                            chatInterfaceButtons:
                              type:
                              - array
                              - 'null'
                              items: {}
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                          required:
                          - self
                        relationships:
                          type:
                          - object
                          - 'null'
                          properties:
                            project:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                    id:
                                      type: string
                                  required:
                                  - type
                                  - id
                              required:
                              - data
                          required:
                          - project
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
                - meta
                - links
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000001
                  type: projects
                  links:
                    self: http://www.example.com/api/projects/00000000-0000-0000-0000-000000000001
                  attributes:
                    createdAt: '2025-05-01T05:05:14.000Z'
                    updatedAt: '2025-05-01T05:05:14.000Z'
                    name: cefwatpd
                    description: null
                    useRuntimeTextResource: false
                    useParentSegment: false
                    useWorkflowExecutor: false
                    isManaged: true
                    managedType: PARENT_SEGMENT
                meta:
                  total: 1
                links:
                  first: http://www.example.com/api/projects?page%5Blimit%5D=20&page%5Boffset%5D=0
                  last: http://www.example.com/api/projects?page%5Blimit%5D=20&page%5Boffset%5D=0
                included:
                - id: 00000000-0000-0000-0000-000000000001
