    post:
      summary: create
      tags:
      - Project
      responses:
        '201':
          description: creates a project with useWorkflowExecutor set to true
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                        required:
                        - self
                      attributes:
                        type: object
                        properties:
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                          name:
                            type: string
                          description:
                            type:
                            - string
                            - 'null'
                          useRuntimeTextResource:
                            type: boolean
                          useParentSegment:
                            type: boolean
                          useWorkflowExecutor:
                            type: boolean
                          isManaged:
                            type: boolean
                          managedType:
                            type: string
                        required:
                        - createdAt
                        - updatedAt
                        - name
                        - description
                        - useRuntimeTextResource
                        - useParentSegment
                        - useWorkflowExecutor
                        - isManaged
                        - managedType
                    required:
                    - id
                    - type
                    - links
                    - attributes
                required:
                - data
              example:
                data:
                  id: 00000000-0000-0000-0000-000000000001
                  type: projects
                  links:
                    self: http://www.example.com/api/projects/00000000-0000-0000-0000-000000000001
                  attributes:
                    createdAt: '2025-05-01T05:05:14.000Z'
                    updatedAt: '2025-05-01T05:05:14.000Z'
                    name: workflow_project
                    description: project with workflow executor
                    useRuntimeTextResource: false
                    useParentSegment: false
                    useWorkflowExecutor: true
                    isManaged: false
                    managedType: NONE
        '400':
          description: rejects POST /api/projects
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                      required:
                      - title
                      - detail
                      - code
                      - status
                required:
                - errors
              example:
                errors:
                - title: Param not allowed
                  detail: managedType is not allowed.
                  code: '105'
                  status: '400'
        '401':
          description: Rejected by 401
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                - status
                - error
              example:
                status: '401'
                error: User credentials aren't set on the request
        '422':
          description: Validation error - invalid or conflicting parameters provided
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                          - pointer
                        status:
                          type: string
                        meta:
                          type: object
                          properties:
                            validationCode:
                              type: string
                          required:
                          - validationCode
                      required:
                      - title
                      - detail
                      - code
                      - source
                      - status
                      - meta
                required:
                - errors
              example:
                errors:
                - title: has already been taken
                  detail: name - has already been taken
                  code: '100'
                  source:
                    pointer: /data/attributes/name
                  status: '422'
                  meta:
                    validationCode: VIOLATES_UNIQUENESS_CONSTRAINT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        useRuntimeTextResource:
                          type: boolean
                        useWorkflowExecutor:
                          type: boolean
                      required:
                      - name
                  required:
                  - type
                  - attributes
              required:
              - data
            example:
              data:
                type: projects
                attributes:
                  name: workflow_project
                  description: project with workflow executor
                  useRuntimeTextResource: true
                  useWorkflowExecutor: true
    put:
      operationId: putProject
      parameters:
      - description: project name
        in: query
        name: project
        required: true
        schema:
          type: string
      - description: revision
        in: query
        name: revision
        required: true
        schema:
          type: string
      - in: header
        name: Content-Length
        schema:
          type: integer
          format: int64
      - description: start scheduling of new workflows from the given time instead of current time
        in: query
        name: schedule_from
        schema:
          type: string
      - description: clear_schedule
        in: query
        name: clear_schedule
        schema:
          type: array
          items:
            type: string
      - description: clear_schedule_all
        in: query
        name: clear_schedule_all
        schema:
          type: boolean
          default: false
      - description: skip schedules to current time for workflows whose schedule definition changed. Ignored when clear_schedule or clear_schedule_all is specified.
        in: query
        name: skip_schedule
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          application/gzip:
            schema:
              type: string
              format: binary
        description: project archive data
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestProject'
          description: default response
      summary: Upload a project archive as a new project or a new revision of an existing project
      tags:
      - Project
    servers:
    - url: https://llm-api.treasuredata.com
    - url: https://llm-api.eu01.treasuredata.com
    - url: https://llm-api.ap02.treasuredata.com
    - url: https://llm-api.treasuredata.co.jp
  /api/projects/{id}:
    delete:
      summary: destroy
      tags:
      - Project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 00000000-0000-0000-0000-000000000001
      responses:
        '204':
          description: Project deleted successfully
        '401':
          description: Unauthorized - authentication credentials are missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                - status
                - error
              example:
                status: '401'
                error: User credentials aren't set on the request
        '403':
          description: Forbidden - insufficient permissions to delete this project
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                - status
                - error
              example:
                status: '403'
                error: Forbidden
        '404':
          description: Project not found
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                      required:
                      - title
                      - detail
                      - code
                      - status
                required:
                - errors
              example:
                errors:
                - title: Record not found
                  detail: The record identified by 00000000-0000-0000-0000-000000000001 could not be found.
                  code: '404'
                  status: '404'
