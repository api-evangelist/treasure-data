      properties:
        columnName:
          type: string
          description: Column name to filter source data
          example: Country
        rightValues:
          type: array
          items:
            type: string
          description: Values of the column to filter source data
          example:
          - Japan
    AudienceBehaviorSchemaWithVisibility:
