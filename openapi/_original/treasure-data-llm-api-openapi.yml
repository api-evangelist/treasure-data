  /api/util/convert_segment_rule:
    post:
      summary: convert_segment_rule
      tags:
        - Util
      responses:
        '200':
          description: creates a rule with only base segment references using AND logic
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  fullIonRule:
                    type: object
                    properties:
                      conditions:
                        type: array
                        items:
                          type: object
                          properties:
                            conditions:
                              type: array
                              items:
                                type: object
                                properties:
                                  arrayMatching:
                                    nullable: true
                                  exclude:
                                    type: boolean
                                  leftValue:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                    required:
                                      - name
                                    nullable: true
                                  operator:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                      not:
                                        type: boolean
                                      rightValue:
                                        oneOf:
                                          - type: number
                                            format: float
                                          - type: integer
                                    required:
                                      - type
                                      - not
                                      - rightValue
                                    nullable: true
                                  type:
                                    type: string
                                  id:
                                    type: string
                                    nullable: true
                                required:
                                  - exclude
                                  - type
                            type:
                              type: string
                          required:
                            - conditions
                            - type
                      type:
                        type: string
                    required:
                      - conditions
                      - type
                required:
                  - name
                  - description
                  - fullIonRule
              example:
                name: Test Simplified Ion Rule
                description: This is a simplified ion rule generated by a chat agent.
                fullIonRule:
                  conditions:
                    - conditions:
                        - exclude: false
                          id: '22222'
                          type: Reference
                        - exclude: false
                          id: '33333'
                          type: Reference
                        - exclude: false
                          id: '44444'
                          type: Reference
                      type: And
                  type: And
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                  - status
                  - error
              example:
                status: '400'
                error: 'param is missing or the value is empty: name'
        '422':
          description: Validation error - invalid or missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                  - status
                  - error
              example:
                status: '422'
                error: simplifiedIonRule is missing required keys
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parent_segment_id:
                  type: string
                simplifiedIonRule:
                  type: object
                  properties:
                    title:
                      type: string
                    summary:
                      type: string
                    conditions:
                      type: array
                      items:
                        type: object
                        properties:
                          attribute_column:
                            type: string
                            description: >-
                              Column name to filter on (alternative to
                              left_value)
                          operator:
                            type: string
                            nullable: true
                            description: Comparison operator
                            enum:
                              - '='
                              - '!='
                              - '>'
                              - '>='
                              - <
                              - <=
                              - IS NULL
                              - IS NOT NULL
                              - IN
                              - BETWEEN
                              - REGEX
                              - NOT REGEX
                          right_value:
                            oneOf:
                              - type: string
                              - type: number
                              - type: boolean
                              - type: array
                                items:
                                  oneOf:
                                    - type: string
                                    - type: number
                                    - type: boolean
                              - type: object
                                additionalProperties: true
                            description: >-
                              Value to compare against (optional, not needed for
                              IS NULL/IS NOT NULL operators)
                          reason:
                            type: string
                            nullable: true
                            description: Human-readable explanation for this condition
                          left_value:
                            type: string
                            nullable: true
                            description: >-
                              Column name to filter on (alternative to
                              attribute_column)
                          logic:
                            type: string
                            nullable: true
                            enum:
                              - ALL
                              - ANY
                            description: Logic operator for nested conditions
                          conditions:
                            type: array
                            items:
                              type: object
                              properties:
                                left_value:
                                  type: string
                                operator:
                                  type: string
                                  enum:
                                    - '='
                                    - '!='
                                    - '>'
                                    - '>='
                                    - <
                                    - <=
                                    - IS NULL
                                    - IS NOT NULL
                                    - IN
                                    - BETWEEN
                                    - REGEX
                                    - NOT REGEX
                                right_value:
                                  oneOf:
                                    - type: integer
                                    - type: string
                                reason:
                                  type: string
                              required:
                                - left_value
                                - operator
                                - right_value
                                - reason
                            nullable: true
                            description: Nested conditions array
                    logic:
                      type: string
                    baseSegmentIds:
                      type: object
                      properties:
                        logic:
                          type: string
                          enum:
                            - ALL
                            - ANY
                        segment_ids:
                          type: array
                          items:
                            type: string
                        segmentIds:
                          type: array
                          items:
                            type: string
                      required:
                        - logic
                        - segmentIds
                  required:
                    - title
                    - summary
                  anyOf:
                    - type: object
                      required:
                        - conditions
                    - type: object
                      required:
                        - baseSegmentIds
              required:
                - name
                - description
                - simplifiedIonRule
            example:
              name: Test Simplified Ion Rule
              description: This is a simplified ion rule generated by a chat agent.
              parent_segment_id: '11111'
              simplifiedIonRule:
                title: Base Segments AND Combination
