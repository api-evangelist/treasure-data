    post:
      summary: Execute agent schedule - returns workflow YAML
      tags:
        - AgentSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 00000000-0000-0000-0000-000000000001
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Agent schedule execution initiated successfully
          content:
            application/x-yaml:
              schema:
                type: string
              example:
                active_schedule:
                  summary: Active schedule - returns execution workflow
                  value: |
                    ---
                    "+create_chat":
                      http>: /api/chats
                      method: POST
                      content:
                        data:
                          type: chats
                          attributes:
                            formInterfaceId: "12345"
                            inputParameters: '{"param": "value"}'
                    "+with_chat_id":
                      _do:
                        "+continue_chat":
                          py>: continue_chat_handler.handle_sse_request
                          url: /api/chats/${chat_id}/continue
                    "+callback_success":
                      http>: /api/agent_schedules/00000000-0000-0000-0000-000000000001/callback
                      method: POST
                expired_schedule:
                  summary: Expired schedule - returns expiration log
                  value: |
                    ---
                    "+log_expired":
                      echo>: Schedule 00000000-0000-0000-0000-000000000001 has expired and was disabled
        '401':
          description: Unauthorized - authentication credentials are missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                  - status
                  - error
              example:
                status: '401'
                error: User credentials aren't set on the request
        '404':
          description: Agent schedule not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                required:
                  - status
                  - error
              example:
                status: 404
                error: Not Found
