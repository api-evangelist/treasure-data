          format: integer
        id:
          type: string
          format: integer
        name:
          type: string
        realtime:
          type: boolean
          description: Whether the segment is realtime segment or not
          deprecated: true
        kind:
          type: integer
          description: '0: batch, 1: realtime, 2: funnel_stage'
        description:
          type: string
          nullable: true
        segmentFolderId:
          type: string
          format: integer
        population:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
        rule:
          anyOf:
            - $ref: '#/components/schemas/SegmentRule'
            - $ref: '#/components/schemas/partial_v5_rule.yaml-v5IonRule'
    SegmentSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        realtime:
          type: boolean
          deprecated: true
          description: use `kind` instead
        kind:
          type: integer
          description: '0: batch, 1: realtime, 2: funnel_stage'
        description:
          type: string
        segmentFolderId:
          type: integer
          format: int64
        population:
          type: integer
          format: int64
          description: The population of the segment
    SegmentQueryStatus:
      type: object
      properties:
        id:
          type: string
