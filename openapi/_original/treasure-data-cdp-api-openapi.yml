              oneOf:
                - $ref: '#/components/schemas/MlSolutionRfmRuleSchema'
                - $ref: '#/components/schemas/MlSolutionCltvRuleSchema'
    MlSolutionRfmRuleSchema:
      type: object
      required:
        - rQuartile
        - fQuartile
        - mQuartile
        - rfmScore
        - rfmSegment
        - rfmClusterRank
        - rfmQuartile
      properties:
        rQuartile:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 4
          example:
            - 1
            - 2
            - 3
            - 4
        fQuartile:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 4
          example:
            - 1
            - 2
            - 3
            - 4
        mQuartile:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 4
          example:
            - 1
            - 2
            - 3
            - 4
        rfmScore:
          type: string
          example: float
          description: >-
            response is fixed string "float". available value as rule is float,
            minimum = 1, maximum= 4. example: 2.6667
        rfmSegment:
          type: array
          items:
            type: string
            enum:
              - Champions
              - Loyal Customers
              - Potential Loyalists
              - New Customers
              - Promising
              - Need attention
              - Cannot lose them
              - Hibernating
              - High Value Sleeping
              - Lost customers
          example:
            - Champions
            - Loyal Customers
            - Potential Loyalists
            - New Customers
            - Promising
            - Need attention
            - Cannot lose them
            - Hibernating
            - High Value Sleeping
            - Lost customers
        rfmClusterRank:
          type: array
          items:
            type: string
            pattern: ^R[1-4]F[1-4]M[1-4]$
          example:
            - R1F1M1
            - R1F1M2
            - R1F1M3
            - R1F1M4
            - R1F2M1
          description: response is array of all patterns R[1-4]F[1-4]M[1-4]
        rfmQuartile:
          type: array
          items:
            type: string
            pattern: ^R[1-4]F[1-4]M[1-4]$
          example:
            - R1F1M1
            - R1F1M2
            - R1F1M3
            - R1F1M4
            - R1F2M1
          description: response is array of all patterns R[1-4]F[1-4]M[1-4]
