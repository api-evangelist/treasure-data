        parentColumn:
          type: string
          nullable: true
          description: >-
            Column name of the behavior table (This can be null when the column
            is an enriched column)
        matrixColumnName:
          type: string
          description: Column name of the behavior table
        matrixColumnDescription:
          type: string
          nullable: true
