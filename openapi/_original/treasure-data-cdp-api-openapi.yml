components:
  responses:
    BadRequest:
      description: Given parameters are not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        Unauthorized; You don't provide valid credentials. Maybe you didn't
        specify valid TD's Master API Key as 'TD1 {Your TD Master API Key}'.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        Requested resource or action is not allowed because you don't have
        sufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ClientError:
      description: >-
        There is a high possibility of error of the authentication system.
        Please check the contents and authority of the key. Please contact the
        TD support team if you do not resolve it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: >-
        System error. Because there is a possibility of a temporary error due to
        network trouble and so on, we recommend several times retry on request
        side. Please contact the TD support team if you do not resolve it.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                format: int64
                description: Error status
              error:
                type: string
                description: Error message
              details:
                type: string
                description: Detailed error message
            required:
              - status
              - error
    JsonApiBadRequest:
      description: Given parameters are not valid
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/JsonApiBadParameterError'
                    - $ref: '#/components/schemas/JsonApiMaskedValueError'
                    - $ref: '#/components/schemas/JsonApiValidationError'
            required:
              - errors
    JsonApiForbiddenRequest:
      description: >-
        Requested resource or action is not allowed because you don't have
        sufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/JsonApiPermissionError'
            required:
              - errors
    JsonApiNotFoundRequest:
      description: The specified resource is not found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/JsonApiNotFoundError'
            required:
              - errors
    JsonApiConflictRequest:
      description: >-
        The specified resource conflicts; having dependent segments, referencing
        segments, etc.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                description: Error messages. Key name can be vary depends on endpoint.
                properties:
                  id:
                    type: array
                    items:
                      type: string
                      example: 'Segment is referenced by other segments: 123, 345'
                  deletion:
                    type: array
                    items:
                      type: string
                      example: 'SegmentFolder has segments: 123, 456'
              referencedBySegments:
                type: array
                description: This field exists only for segment deletion
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: '[1-9][0-9]*'
                      description: Other Segment ID referencing this segment
              referencedByPredictiveSegments:
                type: array
                description: This field exists only for segment deletion
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: '[1-9][0-9]*'
                      description: PredictiveSegment ID referencing this segment
            required:
              - errors
        application/vnd.treasuredata.v1+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/JsonApiConflictError'
            required:
              - errors
    JsonApiUnprocessableRequest:
      description: The specified resource has unprocessable entities
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/JsonApiUnprocessableEntityError'
            required:
              - errors
    NonJsonApiForbiddenRequest:
      description: >-
        non-JSON:API formatted error for insufficient permission to access a
        resource
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: string
            required:
              - errors
    partial_tree.yaml-GetTreeSegmentFoldersIndexResponse:
      description: >-
        Return all the folders under the Parent Segment. The order is determined
        by depth and name. But top-level folder may not be the first because
        deeper folder can be top-level due to permission.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/partial_pagination.yaml-PaginatedResponse'
              - type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: >-
                      if the length is less than page[size], it means the last
                      page.
                    minLength: 0
                    items:
                      $ref: >-
                        #/components/schemas/partial_tree.yaml-TreeSegmentFolderIndexItem
  schemas:
    NullValue:
      nullable: true
      type: object
      additionalProperties: false
      properties:
        thisKeyNeverHit:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    GenericError:
      type: object
      properties:
        errors:
          type: string
      required:
        - errors
    JsonApiValidationError:
      type: object
      properties:
        code:
          type: string
          description: Error code in string
          enum:
            - validation-error
        status:
          type: string
          description: Status code for error
          enum:
            - '400'
        detail:
          type: string
          description: Detailed error message
          example: Name has already been taken
        source:
          type: object
          properties:
            pointer:
              type: string
              description: Pointer to invalid model attribute
              example: /attributes/id
          required:
            - pointer
        meta:
          type: object
          properties:
            validationCode:
              type: string
              description: Detailed validation error code
              enum:
                - VIOLATES_UNIQUENESS_CONSTRAINT
                - IS_TOO_SHORT
                - IS_TOO_LONG
                - CANNOT_BE_BLANK
                - INVALID_FORMAT_OR_ASSOCIATION
                - COMPOSITE_CONDITION_TOO_FEW_RULES_REFERENCED
                - COMPOSITE_CONDITION_TOO_FEW_RULE_SETS_REFERENCED
                - COMPOSITE_CONDITION_MISSING_RULE_IDENTIFIER
                - COMPOSITE_CONDITION_SYNTAX_ERROR
                - COMPOSITE_CONDITION_TOO_LONG_ALPHABETICAL_IDENTIFIER
                - COMPOSITE_CONDITION_TOO_LONG_NUMERICAL_IDENTIFIER
                - PREDICTIVE_SEGMENT_NOT_YET_SCORED
                - PREDICTIVE_SEGMENT_NOT_YET_TRAINED
                - IS_IMMUTABLE
                - UNKNOWN
                - TOO_MANY_BEHAVIOR_RULES
                - INVALID_WINDOW_DURATION
                - UNDEFINED_ENTRY_CRITERIA
                - UNDEFINED_MILESTONE
                - UNDEFINED_ACTIVATION_STEP
                - UNDEFINED_WAIT_STEP
                - UNDEFINED_EXIT_CRITERIA
                - UNDEFINED_DECISION_CONDITION
                - UNDEFINED_MERGE_POINT
                - UNUSED_IN_ID_LINK
                - TOO_MANY_PRIMARY_KNOWN_IDS
                - TOO_LESS_PRIMARY_KNOWN_IDS
                - TOO_MANY_RT_SEGMENTS
          required:
            - validationCode
      required:
        - code
        - status
        - detail
        - source
        - meta
    JsonApiBadParameterError:
      type: object
      properties:
        code:
          type: string
          description: Error code in string
          enum:
            - bad-parameter-error
        status:
          type: string
          description: Status code for error
          enum:
            - '400'
        detail:
          type: string
          description: Detailed error message
          example: SegmentFolder View Permission Required
        source:
          type: object
          properties:
            pointer:
