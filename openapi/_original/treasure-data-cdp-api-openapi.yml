              description: Pointer to invalid parameter
              example: /attributes/segments/
          required:
            - pointer
        meta:
          type: object
          properties:
            parameterCode:
              type: string
              description: Detailed validation error code
              enum:
                - SHOULD_BE_ARRAY
                - INVALID_FORMAT
          required:
            - parameterCode
      required:
        - code
        - status
        - detail
    JsonApiMaskedValueError:
      type: object
      properties:
        code:
          type: string
          description: Error code in string
          enum:
            - bad-parameter-error
        status:
          type: string
          description: Status code for error
          enum:
            - 400
        detail:
          type: string
          description: Detailed error message
          example: masked value is used
        source:
          type: object
          properties:
            pointer:
              type: string
              description: Pointer to invalid parameter
              example: /attributes/syndication/columns/0
          required:
            - pointer
        meta:
          type: object
          properties:
            parameterCode:
              type: string
              description: Detailed validation error code
              enum:
