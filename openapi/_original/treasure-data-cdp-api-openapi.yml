        rightValues:
          type: array
          items:
            type: string
          description: Values of the column to filter source data
          example:
            - Japan
    Audience:
      required:
        - name
      type: object
      description: >-
        An audience handles a Master Segment and a related Master Segment
        Config.
      properties:
        id:
          type: string
          format: integer
        name:
          type: string
        description:
          type: string
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        scheduleOption:
          type: string
          nullable: true
          example: '00:00'
        timezone:
          type: string
          example: UTC
        matrixUpdatedAt:
          type: string
          nullable: true
          format: datetime
        workflowHiveOnly:
          type: boolean
          description: Whether the workflow mainly use Hive or not. Default is false
        hiveEngineVersion:
          type: string
          description: Hive engine version used in audience workflows
          enum:
            - '0.13'
            - cdpaudience
        hivePoolName:
          type: string
          nullable: true
        prestoPoolName:
          type: string
          nullable: true
        allowActivationBehavior:
          type: boolean
          nullable: true
        maxActivationBehaviorRow:
          type: integer
          nullable: true
          description: |
            Only null is acceptable when allowActivationBehavior is false.
        llmEnabled:
          type: boolean
          nullable: true
          description: >
            llmEnabled indicates whether customer has enabled llm (true or
            false).
        llmState:
          type: string
          enum:
            - enabling
            - enabled
            - disabling
            - disabled
          description: |
            llmState indicates more detailed state including updating.
        population:
          type: integer
          format: int64
          nullable: true
          description: the population of the audience
        enrichmentWordTaggingEnabled:
          type: boolean
        enrichmentIpEnabled:
          type: boolean
        enrichmentTdJsSdkEnabled:
          type: boolean
        master:
          $ref: '#/components/schemas/AudienceMaster'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AudienceAttribute'
        behaviors:
          type: array
          items:
            $ref: '#/components/schemas/AudienceBehavior'
        customerGroup:
          $ref: '#/components/schemas/CustomerGroup'
        audienceFilters:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AudienceFilter'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
    ComposableAudience:
      required:
        - name
        - masterSchema
        - masterTable
        - timezone
      type: object
      description: >-
        A composable audience for zero-copy segments using CDW tables via
        federated queries (Snowflake) or direct connections (Databricks).
        Exactly one of federatedQueryConfigId or connectionId must be provided.
      properties:
        id:
          type: string
          format: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        federatedQueryConfigId:
          type: string
          format: integer
          description: >-
            Federated query config ID for Snowflake. Mutually exclusive with
            connectionId.
        connectionId:
          type: string
          format: integer
          description: >-
            Connection ID for Databricks. Mutually exclusive with
            federatedQueryConfigId.
        masterCatalog:
          type: string
          nullable: true
          description: >-
            Catalog name for the master table. Required for Databricks, null for
            Snowflake.
        masterSchema:
          type: string
        masterTable:
          type: string
        masterKeyColumn:
          type: string
        timezone:
          type: string
        allowActivationBehavior:
          type: boolean
          description: whether activation behaviors are allowed for this audience
        maxActivationBehaviorRow:
          type: integer
          format: int64
          description: maximum number of activation behavior rows
        isComposable:
          type: boolean
        kind:
          type: string
          enum:
            - composable
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ComposableAudienceAttribute'
        behaviors:
          type: array
          items:
            $ref: '#/components/schemas/ComposableAudienceBehavior'
        population:
          type: integer
          format: int64
          nullable: true
          description: the population of the composable audience
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
    ComposableAudienceAttribute:
      required:
        - name
        - schema
        - table
        - tableKey
        - masterKey
        - column
      type: object
      description: Exactly one of federatedQueryConfigId or connectionId must be provided.
      properties:
        id:
          type: string
          format: integer
        name:
          type: string
        federatedQueryConfigId:
          type: string
          format: integer
          description: >-
            Federated query config ID for Snowflake. Mutually exclusive with
            connectionId.
        connectionId:
          type: string
          format: integer
          description: >-
            Connection ID for Databricks. Mutually exclusive with
            federatedQueryConfigId.
        schema:
          type: string
        table:
          type: string
        tableKey:
          type: string
        masterKey:
          type: string
        column:
          type: string
        type:
          description: >-
            Optional. If omitted, the ION type is auto-filled from the CDW
            column's native type.
          allOf:
            - $ref: '#/components/schemas/ColumnType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComposableAudienceBehavior:
      required:
        - name
        - schema
        - table
        - tableKey
        - masterKey
        - columnMapping
      type: object
      description: Exactly one of federatedQueryConfigId or connectionId must be provided.
      properties:
        id:
          type: string
          format: integer
        name:
          type: string
        federatedQueryConfigId:
          type: string
          format: integer
          description: >-
            Federated query config ID for Snowflake. Mutually exclusive with
            connectionId.
        connectionId:
          type: string
          format: integer
          description: >-
            Connection ID for Databricks. Mutually exclusive with
            federatedQueryConfigId.
        schema:
          type: string
        table:
          type: string
        tableKey:
          type: string
        masterKey:
          type: string
        timeColumn:
          type: string
        columnMapping:
          type: array
          items:
            type: object
            required:
              - name
              - cdwColumn
            properties:
              name:
                type: string
              type:
                $ref: '#/components/schemas/ColumnType'
              cdwColumn:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComposableActivationOverview:
      type: object
