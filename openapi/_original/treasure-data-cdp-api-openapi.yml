            start_at_desc:
              value: start_at:desc
              summary: Sorted by start_at in an descending order
            repeat_unit_asc:
              value: repeat_unit:asc
              summary: Sorted by repeat_unit in an ascending alphabetical order
            created_by_td_user_id_asc:
              value: created_by_td_user_id:asc
              summary: Sorted by the User ID of created_by in an ascending order
            created_by_user_name_desc:
              value: created_by_user_name:desc
              summary: Sorted by the User Name of created_by in an descending order
            updated_at_desc:
              value: updated_at:desc
              summary: Sorted by updated_at in an descending order
            created_at_desc:
              value: created_at:desc
              summary: Sorted by created_at in an descending order
        - name: name_include
          in: query
          required: false
          description: >-
            filter by Activation's name to return only Activations whose name
            includes the value
          schema:
            type: string
        - name: segment_name_include
          in: query
          required: false
          description: >-
            filter by Segment's name to return only Activations whose Segment
            name includes the value
          schema:
            type: string
        - name: start_after
          in: query
          required: false
          description: filter by start_at to return only Activations that starts after
          schema:
            type: string
            format: date-time
        - name: start_before
          in: query
          required: false
          description: filter by start_at to return only Activations that starts before
          schema:
            type: string
            format: date-time
        - name: connection_type
          in: query
          required: false
          description: >-
            filter by Connection Type return only Activations whose Connection
            Types match (Note that Pagination parameters page[size] and
            page[after] are ignored if connection_type is specified)
          schema:
            type: array
            items:
