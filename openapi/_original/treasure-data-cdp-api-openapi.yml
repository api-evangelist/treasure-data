        - name: created_by_td_user_id
          in: query
          required: false
          description: filter by the User ID of created_by
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
        - name: activation_template_id
          in: query
          required: false
          description: >-
            filter by activation_template_id, "none" matches with an Activation
            that has no Activation Template, but it does not match with an
            Activation that has a deleted Activation Template
          schema:
            type: array
            items:
              oneOf:
