            - error
            - canceling
            - canceled
            - running
            - waiting
        id:
          type: string
          description: Activation ID
          format: integer
        name:
          type: string
          description: Activation Name
        segmentId:
          type: string
          format: integer
        segmentName:
          type: string
        folder:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: integer
              name:
                type: string
        activationTemplateId:
          type: string
          nullable: true
          format: integer
        activationTemplateName:
          type: string
          nullable: true
        connectionId:
          type: string
          format: integer
        connectionType:
          type: string
          nullable: true
        connectionTypeDescription:
          type: string
          nullable: true
        connectionName:
          type: string
          nullable: true
        connectionValid:
          type: boolean
        startAt:
          $ref: '#/components/schemas/StartAt'
        endOn:
          type: string
          format: date
          nullable: true
        workflowProjectName:
          type: string
          nullable: true
        workflowName:
          type: string
          nullable: true
        lastExecution:
          type: object
          nullable: true
          properties:
            syndicationId:
              type: string
              format: integer
            workflowId:
              type: string
            workflowProjectId:
              type: string
              format: integer
            workflowSessionId:
              type: string
              format: integer
            workflowAttemptId:
              type: string
              format: integer
            createdAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
            status:
              type: string
        lastRecordCount:
          type: integer
          format: int64
          nullable: true
        repeatUnit:
          $ref: '#/components/schemas/RepeatUnit'
        repeatFrequency:
