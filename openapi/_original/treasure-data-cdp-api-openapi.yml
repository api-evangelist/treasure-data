              primaryKey:
                type: string
                description: Primary key for behavior table on ADL
              indexes:
                type: array
                description: >-
                  Indexes columns for behaviors table on ADL. If primaryKey is
                  null, you need to include td_client_id column in indexes.
                  Default: []
                items:
                  type: string
              excludeColumns:
                type: array
                description: 'Column names to be excluded to sync into ADL. Default: []'
                items:
                  type: string
              sortColumns:
                type: array
                description: 'Column names to be used for sorting on ADL. Default: []'
                items:
                  type: string
              filterColumns:
                type: array
                description: 'Column names to be used for filtering on ADL. Default: []'
                items:
                  type: string
              realtimeUpdate:
                type: boolean
                description: >-
                  Enables to sync parent table of behavior table into ADL
                  one-time. If there are existing tables that have same name as
                  parent tables on ADL, it won't sync them. Default false.
              overwriteParentTable:
                type: boolean
                description: >-
                  Overwrite parent tables on ADL for realtime update. This
                  enables to sync parent table regardless of existing the ADL
                  table. Default false.
              cleanupParentTable:
                type: boolean
                description: If true, remove behavior parent table on ADL. Default false.
        subdimensions:
          type: array
          items:
            type: object
            description: >-
              ADL table setting for sub dimension table. A sub dimension table
              enables to sync user table into ADL and link to behavior table. A
              table name can be
              'cdp_{audinece_id}_cc.user_{database_name}_{table_name}'.
            required:
              - databaseName
              - tableName
              - primaryKey
            properties:
              databaseName:
                type: string
                description: Database name on Plazma DB
              tableName:
                type: string
                description: Table name on Plazma DB
              primaryKey:
                type: string
                description: Primary key for sub dimension table on ADL
              indexes:
                type: array
                description: 'Indexes columns for sub dimensions table on ADL. Default: []'
                items:
                  type: string
              excludeColumns:
                type: array
                description: 'Column names to be excluded to sync into ADL. Default: []'
                items:
                  type: string
              sortColumns:
                type: array
                description: 'Column names to be used for sorting on ADL. Default: []'
                items:
                  type: string
              filterColumns:
                type: array
                description: 'Column names to be used for filtering on ADL. Default: []'
                items:
                  type: string
              linkKey:
                type: string
                description: >-
                  Join key to be joined with another table. Target table's
                  primary key for ADL should be same.
                nullable: true
              linkTable:
                type: string
                description: >-
                  Join full target table name on ADL. For behavior table, it
                  should be "cdp_{audience_id}_cc.behaviors_{table_name}".
                nullable: true
