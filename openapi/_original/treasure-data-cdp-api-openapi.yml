        repeatSubFrequency:
          $ref: '#/components/schemas/RepeatSubFrequency'
        lockEnabled:
          type: boolean
        activationActionsEnabled:
          type: boolean
        timezone:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
    CustomerGroup:
      required:
        - name
        - parentDatabaseName
        - parentTableName
