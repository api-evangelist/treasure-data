              description: '1: unified-customer-view'
              enum:
                - 1
        datasource:
          type: object
          description: Sisense Datasource attributes used for building dashboard filter
          required:
            - title
            - fullname
            - address
          properties:
            fullname:
              type: string
              description: >-
                Full name of Datasource in Sisense. It is a concatenation of a
                Data model's server and title
              example: localhost/kom Presto data model via API
            address:
              type: string
              description: Same as data model server name
              example: LocalHost
            live:
              type: boolean
              description: Whether Datasource is Live model or not (Elasticube).
              example: false
            title:
              type: string
              description: Same as data model title
              example: kom Presto Datamodel via API
    SisenseDatamodel:
      type: object
      properties:
        id:
          type: string
        audienceId:
          type: string
          format: integer
        datamodelOid:
          type: string
          description: Data model oid in Sisense
          example: a17a0f1ec9954a72-0e1fa49aa8ba4e83
        datamodelType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SisenseSyncExecution:
      allOf:
        - $ref: '#/components/schemas/Execution'
        - type: object
          properties:
            audienceId:
              type: string
              format: integer
    Statistic:
      type: array
      items:
        type: array
        description: >-
          a tuple whose values are Unix epoch, the population, whether a
          workflow has run at that time or not. If the third value is false, it
          is imputed value.
        example:
          - 1556382847
          - 1234
          - true
        items:
          oneOf:
            - type: integer
              format: int64
            - type: boolean
    PredictiveSegmentPreprocessItem:
      type: object
      properties:
        column:
          type: string
        source:
          type: object
          properties:
            column:
              type: string
            table:
              type: string
            functions:
              type: array
              items:
                $ref: '#/components/schemas/FunctionExpression'
      required:
        - column
        - source
    PredictiveSegmentGradeThresholds:
      type: array
      minItems: 3
      maxItems: 3
      description: Given the items [a, b, c], they must meet the condition `a >= b >= c`
      example:
        - 75
        - 50
        - 25
      items:
        type: number
        format: double
        minimum: 0
        maximum: 100
    PredictiveSegmentAccuracy:
      type: number
      format: double
      minimum: 0
      maximum: 100
      nullable: true
      description: Accuracy for trained model evaluated on initial training.
    PredictiveSegmentAreaUnderRocCurve:
      type: number
      format: double
      minimum: 0
      maximum: 1
      nullable: true
      description: >-
        Evaluation score for the model. See also
        https://en.wikipedia.org/wiki/Receiver_operating_characteristic#Area_under_the_curve
    PredictiveSegmentModelScoreHistogram:
      type: array
      items:
        type: array
        items:
          oneOf:
            - type: string
            - type: integer
        minLength: 2
        maxLength: 2
      example:
        - - '1'
          - 300
        - - '2'
          - 200
    PredictiveSegmentRule:
      type: object
      properties:
        categoricalAsColumnNames:
          type: array
          items:
            type: string
        categoricalArrayAsColumnNames:
          type: array
          items:
            type: string
        quantitativeAsColumnNames:
          type: array
          items:
            type: string
        preprocess:
          type: array
          description: >-
            Definition of preprocess. All of `$item.column` must be specified in
            one of categoricalAsColumnNames, categoricalArrayAsColumnNames, or
            quantitativeAsColumnNames.
          minItems: 1
          items:
            $ref: '#/components/schemas/PredictiveSegmentPreprocessItem'
    TableConfig:
      type: object
