          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
    ServiceBehavior:
      type: object
      description: >-
        ADL table setting for behavior table. Table name on ADL can be
        'cdp_{audience_id}_cc.behaviors_{table_name}'. If realtime_update is
        true, table name will be same as parent table name.
      required:
        - id
        - primaryKey
        - excludeColumns
        - sortColumns
        - filterColumns
        - realtimeUpdate
        - overwriteParentTable
        - cleanupParentTable
        - adlFullTableName
        - audienceBehavior
      properties:
        id:
          type: string
          pattern: '[1-9][0-9]*'
        primaryKey:
          type: string
          nullable: true
          description: Primary key for behavior table on ADL
        indexes:
          type: array
          description: 'Indexes columns for customers table on ADL. Default: []'
          items:
            type: string
        excludeColumns:
          description: 'Column names to be excluded to sync into ADL. Default: []'
          type: array
          items:
            type: string
        sortColumns:
          description: 'Column names to be used for sorting on ADL. Default: []'
          type: array
          items:
            type: string
        filterColumns:
          description: 'Column names to be used for filtering on ADL. Default: []'
          type: array
          items:
            type: string
        realtimeUpdate:
          type: boolean
          description: >-
            Enables to sync parent table of behavior table into ADL one-time. If
            there are existing tables that have same name as parent tables on
            ADL, it won't sync them. Default false.
        overwriteParentTable:
          type: boolean
          description: >-
            Overwrite parent tables on ADL for realtime update. This enables to
            sync parent table regardless of existing the ADL table. Default
            false.
        cleanupParentTable:
          type: boolean
          description: If true, remove behavior parent table on ADL. Default false.
        adlFullTableName:
          type: string
          description: >-
            Data base name and table name on ADL. If realtimeUpdate is true,
            database name and table name is same as parent table of the behavior
            table.
          example: cdp_1234_cc.behavior_weblogs
        audienceBehavior:
          $ref: '#/components/schemas/AudienceBehavior'
    ServiceSubdimension:
      type: object
      description: >-
        ADL table setting for sub dimension table. A sub dimension table enables
        to sync user table into ADL and link to behavior table. A table name can
        be 'cdp_{audinece_id}_cc.user_{database_name}_{table_name}'.
      required:
        - id
        - databaseName
        - tableName
        - primaryKey
        - excludeColumns
        - sortColumns
        - filterColumns
        - adlFullTableName
      properties:
        id:
          type: string
          pattern: '[1-9][0-9]*'
        databaseName:
          type: string
          description: Database name on Plazma DB
        tableName:
          type: string
          description: Table name on Plazma DB
        primaryKey:
          type: string
          description: Primary key for sub dimension table on ADL
        indexes:
          type: array
          description: 'Indexes columns for customers table on ADL. Default: []'
          items:
            type: string
        excludeColumns:
          description: 'Column names to be excluded to sync into ADL. Default: []'
          type: array
          items:
            type: string
        sortColumns:
          description: 'Column names to be used for sorting on ADL. Default: []'
          type: array
          items:
            type: string
        filterColumns:
          type: array
          description: 'Column names to be used for filtering on ADL. Default: []'
          items:
            type: string
        adlFullTableName:
          type: string
          description: >-
            Data base name and table name on ADL. The ADL table name should be
            'user_{database_name}_{table_name}'.
          example: cdp_1234_cc.user_userdb_orders
        linkKey:
          type: string
          description: >-
            Join key to be joined with another table. Target table's primary key
            for ADL should be same.
          nullable: true
        linkTable:
          type: string
          description: >-
            Join full target table name on ADL. For behavior table, it should be
            "cdp_{audience_id}_cc.behaviors_{table_name}".
          nullable: true
    TableConfigParameters:
      type: object
      required:
