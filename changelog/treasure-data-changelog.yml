name: Treasure Data Release Notes
description: >-
  Treasure AI publishes dated monthly release notes covering every product area, with individual entries
  carrying their own "Posted on" date. History runs continuously from January 2023 through August 2026.
specificationVersion: '0.1'
generated: '2026-08-13'
method: searched
source: https://docs.treasure.ai/release-notes
url: https://docs.treasure.ai/release-notes
machine_readable: https://docs.treasure.ai/release-notes.md
scheme: monthly-dated
grouping: by product area (AI Studio, AI Agent Foundry, CDP, Audience Studio, Integrations, Platform)
current_release: '2026-08'
history_from: '2023-01'
entry_count_recent: 3
entries:
  - version: '2026-08'
    date: '2026-08'
    url: https://docs.treasure.ai/release-notes/2026/august-2026-release-note
    breaking: false
    highlights:
      - >-
        AI Studio — Agent Sandbox now gives every chat its own environment; files written outside a work
        folder are removed with the chat, and previously accumulated files were moved into a MIGRATED_HOME
        folder. Posted 2026-08-12.
      - >-
        AI Studio — Work Folder Actions: save a recurring multi-step workflow in a work folder and rerun
        it with one click or by typing /<name> in a chat. Posted 2026-08-13.
  - version: '2026-07'
    date: '2026-07'
    url: https://docs.treasure.ai/release-notes/2026/july-2026-release-note
    breaking: false
    highlights:
      - >-
        AI Studio — Custom Skill Sharing: share skills built in a project across the account as a named
        plugin without publishing to a public GitHub repository. Posted 2026-07-03.
      - >-
        AI Studio available in the Korea (ap02) region, with LLM inference kept inside the Korea boundary
        on Amazon Bedrock (Seoul); Balanced tier only. Posted 2026-07-03.
      - Connections can now be created directly from a chat.
  - version: '2026-06'
    date: '2026-06'
    url: https://docs.treasure.ai/release-notes/2026/june-2026-release-note
    breaking: false
    highlights:
      - AI Agent Foundry adds Claude Sonnet 4.6 support across US, Tokyo and EU01. Posted 2026-06-01.
      - AI Studio agents can search the web in real time during a chat. Posted 2026-06-03.
      - >-
        Plugin Marketplace for AI Studio — register public GitHub-hosted skill marketplaces and install
        plugins per user; Treasure AI's own plugins ship enabled. Posted 2026-06-17. This is the surface
        that distributes github.com/treasure-data/td-skills.
archive:
  years: [2026, 2025, 2024, 2023]
  note: >-
    2026 has eight monthly notes (January through August). 2025 has ten (March and April are absent from
    the index). 2024 and 2023 are complete twelve-month sets.
notes:
  - >-
    The release notes are product release notes, not an API changelog. Endpoint-level additions, renames
    and removals are not itemised, and there is no per-API version history — so a client integrator
    cannot diff the contract from this surface.
  - >-
    Each monthly page is also served as markdown at the same path with a .md suffix, which makes the
    changelog machine-readable without scraping.
