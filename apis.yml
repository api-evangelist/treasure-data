- aid: treasure-data:treasure-data-funnels-api
  name: Treasure Data Funnels API
  description: >-
    One of the challenges of targeting customers with relevant campaigns is understanding where they are
    in their customer journey. Many organizations use the traditional marketing funnel to understand where
    their customers are in the buying process. Knowing where customers are in the marketing funnel allows
    organizations to create campaigns and analyze customer behaviors that are specific to individual customers
    or customer groups. Being able to use all available customer data to accurately identify exactly in
    which stage customers are in gives marketers a clear advantage. <br> <br> Treasure Data offers Funnels,
    a premium subscription feature in Audience Studio, which provides this advantage to its users. Funnels
    make it easier for marketers to see exactly where their customers are in the buying process, allowing
    them to create more customer-tailored marketing campaigns using multi-channel activations.<br> <br>
    Funnels enables marketers to create and customize a marketing funnel with up to eight stages in the
    Audience Studio to reflect the exact buying experience of their customers. After the Funnel stages
    have been created, marketers can further analyze and refine the stages and activate specific stages
    for campaigns.
  humanURL: https://docs.treasure.ai/apis/td-api/bulk-loads-api
  baseURL: https://api.treasuredata.com/v3/bulk_loads
