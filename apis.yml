name: Treasure Data
description: >-
  Treasure Data — rebranded Treasure AI in April 2026 — is an enterprise customer data platform that
  unifies first-party customer data and activates it across marketing, service and AI agent workloads.
  It publishes eight OpenAPI descriptions covering 405 operations: the Treasure Data API v3 for
  databases, tables, query jobs, schedules and access control; the CDP (Audience) API for parent
  segments, segments, journeys, funnels, predictive segments and activations; the LLM API for AI agents,
  chats and knowledge bases; Treasure Workflow for Digdag orchestration; a Data Warehouse Integration
  API for Snowflake and Databricks; the Personalization Service for real-time offers; and Postback v1
  and v2 for event ingestion. Queries run on Trino/Presto and Hive. An official MCP server exposes 23
  tools over stdio and the documentation site serves a live remote MCP endpoint.
