    reporting.</li> <li> **Segment activation** &mdash; Activate the segment data (export) to external
    tools for activities such as marketing campaigns, business analysis, and social media. Targets include
    Email Marketing Systems, Marketing Automation Systems, Advertising Platforms, CRM, ERP, Cloud Services,
    and SFTP.</li> </ul><br>_Known formerly as syndication in Audience Studio Legacy. You may continue
