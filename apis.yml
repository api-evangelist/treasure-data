- aid: treasure-data:treasure-data-tokens-api
  name: Treasure Data Tokens API
  description: >-
    The Profiles API Token enables your ability to increase personalized content based on detailed customer
    information. This REST API returns customer data in real-time and updates your segment information.
    The ability to create a Profiles API token is based on your <a href="https://docs.treasuredata.com/display/public/PD/Folder-based+Permissions">folder
    permissions.</a> <br> <br> You can also use Profiles API Token to personalize your customers' experience
    on your website. You can combine Treasure Data’s personalization feature with A/B Testing tools such
    as Adobe Target, Optimizely, or Google Optimize, to determine the version of your website that yields
    results. <br> <br> When the underlying personalization workflow completes, the personalization data
    set is refreshed. You can see a current list of the segments to which a specific profile belongs.
    You can also see a list of attributes associated with the specific profile.<br> <br> The parent segment
    must already exist. The parent segment is the basis for all data accessed by Profiles API Tokens.
    <br> <br> The use of the Profiles API Token with your tools requires the use of the Treasure Data
    JavaScript SDK and support or services consultation.
  humanURL: https://docs.treasure.ai/apis/td-api/bulk-loads-api
  baseURL: https://api.treasuredata.com/v3/bulk_loads
