- aid: treasure-data:treasure-data-predictive-segments-api
  name: Treasure Data Predictive Segments API
  description: >-
    Using Treasure Data’s predictive scoring model, based on predictive segments, marketers can predict
    profile behavior such as who is likely to churn, purchase, click, or convert in the near future. <br>
    <br> A predictive model is a set of rules that makes it possible to predict an unmeasured value from
    other, known values. The form of the rules is suggested by reviewing the data collected. Training
    is then used to make some predictions. Predictive modeling uses statistics to predict outcomes. <br><br>Predictive
    modeling is a typically used statistical technique to predict future behavior. Predictive modeling
    solutions analyze historical and current data and the generated model helps predict future outcomes.
    In predictive modeling, data is collected, a statistical model is formulated, predictions are made,
    and the model is validated (or revised) as additional data becomes available. For example, risk models
    can be created to combine member information in complex ways with demographic and lifestyle information
    from external sources to improve underwriting accuracy. Predictive models analyze past performance
    to assess how likely a customer is to exhibit a specific behavior in the future. This category also
    encompasses models that seek out subtle data patterns to answer questions about customer performance,
    such as fraud detection models. Predictive models often perform calculations during live transactions—for
    example, to evaluate the risk or opportunity of a given customer or transaction to guide a decision.
    <br> <br> Treasure Data’s predictive scoring model uses predictive segments to customize predictive
    scoring models for a particular segment.
  humanURL: https://docs.treasure.ai/apis/td-api/bulk-loads-api
  baseURL: https://api.treasuredata.com/v3/bulk_loads
