- aid: treasure-data:treasure-data-segments-api
  name: Treasure Data Segments API
  description: >-
    In marketing, a segment is a container that groups profiles (usually people) who share one or more
    common characteristics. In Treasure Data, the parent segment is your total population of people, accounts,
    or other type of collection and can be both existing and potential customers. <br> <br>You create
    segments to divide the population into subgroups of consumers based on some type of shared characteristics.
    Segments and subsegments enable more specific targeting for your marketing campaigns. <br> <br> <br>_Treasure
    Data is making an effort to use more inclusive language in its product, content, and customer solutions.
    As we gradually make the move to replace insensitive language beginning in our UI, you may continue
    to see parent segments in the UI, for example, referenced as master segment in portions of Treasure
    Data APIs._
