notes:
- The estate has three largely disjoint object graphs. The TD API models the warehouse (Database -> Table
  -> Job -> Schedule) plus the access-control graph (User <-> Policy <-> PolicyGroup <-> Permission).
  The CDP API models the audience graph (Audience -> Segment -> Syndication/Activation, plus Journeys,
  Funnels, Predictive Segments and Tokens). Treasure Workflow models the Digdag graph (Project -> Workflow
  -> Session -> Attempt -> Task -> Log). Nothing in the published specs links a CDP Audience back to the
  TD Database it is built on — that join exists in the product but not in the contract.
- User is the most connected entity in the estate (34 typed references), which reflects how much of the
  TD API is access control rather than data.
- No id-prefix convention is published. Identifiers are bare integers or strings; there is no Stripe-style
  typed-prefix scheme that would let an agent infer an object's type from its id.
