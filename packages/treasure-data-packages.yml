notes:
  - >-
    Every package above is published under the treasure-data GitHub organization or by Treasure Data on the
    registry, so all are marked official.
  - >-
    Decay signal — pandas-td (2019) and fluent-plugin-td (2022) predate the current API surface by years;
    the actively maintained clients are td-client-python, pytd, td-client-ruby, td (toolbelt), td-client-java,
    td-client-go, td-js-sdk and @treasuredata/mcp-server.
