name: Treasure Data Packages and SDKs
description: >-
  First-party Treasure Data (Treasure AI) client libraries, SDKs, agents and command-line tools published
  to public package registries. Versions and publication dates were read from each registry's own metadata
  endpoint on the generated date; a null version means the registry did not answer or the package is absent.
specificationVersion: '0.1'
generated: '2026-08-13'
method: searched
source: >-
  registry.npmjs.org, pypi.org/pypi, rubygems.org/api/v1, search.maven.org, proxy.golang.org,
  trunk.cocoapods.org, github.com/treasure-data, https://docs.treasure.ai/tools/cli-and-sdks/quickstart
docs: https://docs.treasure.ai/apis/td-api/td-client/td-client-python
package_count: 12
official_count: 12
